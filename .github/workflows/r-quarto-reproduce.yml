name: Reproduce R and render Quarto

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Validate source, reproduce SPSS benchmarks, render Quarto
    runs-on: ubuntu-latest
    steps:
      - name: Check out source files without write permissions
        uses: actions/checkout@v4

      - name: Validate required public inputs and record tracked-file hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          required = [
              pathlib.Path("data/raw/survey_responses.csv"),
              pathlib.Path("data/metadata/item_codebook.csv"),
              pathlib.Path("data/reference/spss_published_benchmarks.csv"),
              pathlib.Path("analysis/master.R"),
              pathlib.Path("tests/run_tests.R"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise FileNotFoundError("Required reproducibility inputs missing: " + ", ".join(missing))

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          out = pathlib.Path("outputs/integrity")
          out.mkdir(parents=True, exist_ok=True)
          entries = []
          verified = 0
          for raw_name in tracked:
              if not raw_name:
                  continue
              path = pathlib.Path(raw_name.decode("utf-8"))
              if not path.is_file():
                  raise FileNotFoundError(f"Tracked file missing from checkout: {path}")
              entries.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}")
              verified += 1
          (out / "MANIFEST.sha256").write_text("\n".join(entries) + "\n", encoding="utf-8")
          print(f"Required public inputs present; hashed {verified} tracked files.")
          PY

      - name: Install R 4.4.3
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Install research and rendering dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::sandwich

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Reproduce analysis and verify rounded SPSS benchmarks
        run: Rscript analysis/master.R

      - name: Render the Quarto research companion
        run: quarto render

      - name: Attach reproducibility evidence (no publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-finance-reproduction
          if-no-files-found: warn
          path: |
            _site/
            outputs/tables/
            outputs/integrity/
            outputs/session_info.txt
            figures/
          retention-days: 30
