name: Reproduce R and render Quarto

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Validate source, reproduce SPSS benchmarks, render Quarto
    runs-on: ubuntu-latest
    steps:
      - name: Check out source files without write permissions
        uses: actions/checkout@v4

      - name: Verify untouched writing-sample PDF and record input hashes
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.5'
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import fitz

          pdf = pathlib.Path("writing-sample/writing_sample.pdf")
          with fitz.open(pdf) as document:
              if len(document) != 25:
                  raise AssertionError(f"Expected 25 writing-sample pages, got {len(document)}")
              front = document[0].get_text()
              expected_prefix = "Writing sample, PhD application,"
              expected_suffix = "School of the Environment, Fall 2027"
              if expected_prefix not in front or expected_suffix not in front:
                  raise AssertionError("Original writing-sample title-page line is missing or altered")
              if "Practitioner perspectives on institutional collaboration" not in front:
                  raise AssertionError("Unexpected writing-sample document")

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          out = pathlib.Path("outputs/integrity")
          out.mkdir(parents=True, exist_ok=True)
          entries = []
          for raw_name in tracked:
              if not raw_name:
                  continue
              path = pathlib.Path(raw_name.decode("utf-8"))
              if not path.is_file():
                  raise FileNotFoundError(f"Tracked file missing from checkout: {path}")
              entries.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}")
          (out / "MANIFEST.sha256").write_text("\n".join(entries) + "\n", encoding="utf-8")
          print(f"PDF title-page preserved; verified {len(tracked)-1} tracked source files.")
          PY

      - name: Install R 4.4.3
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Install research and rendering dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::sandwich

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Reproduce analysis and verify rounded SPSS benchmarks
        run: Rscript analysis/master.R

      - name: Render the Quarto research companion
        run: quarto render

      - name: Attach reproducibility evidence (no publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-finance-reproduction
          if-no-files-found: warn
          path: |
            _site/
            outputs/tables/
            outputs/integrity/
            outputs/session_info.txt
            figures/
          retention-days: 30
